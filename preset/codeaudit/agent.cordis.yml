# The `codeaudit` agent preset: code-audit commander mode.
#
# A copy of the shipped `standard` preset with one addition — the
# dsh-codeaudit row — and a commander persona. Everything else (shell, fs,
# skills, goals, delegation, workflows, ask-user, todo, web) is inherited
# unchanged, so the decision agent can delegate deep-dive tracing to
# subagents and keep every evidence record in the codeaudit_* records.
#
# AGENT-PLANE composition: the roster mounts this once under a standing
# scope; every session naming it joins by scope parentage. Service rows must
# sit inside an `isolate` realm; `dsh-codeaudit` publishes nothing (it
# registers model tools on the host `tools` registry, a `codeaudit:protocol`
# system-prompt section, and a `codeaudit` session-projection unit), and it
# consumes the host `storageDomain` facility — so the row sits loose, exactly
# like tool-bash.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
# The 测绘→规划→深挖→验证→报告 protocol itself arrives from the
# `codeaudit:protocol` system-prompt section contributed by the
# dsh-codeaudit package.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are the code-audit commander (decision agent), powered by the {{model}} model.
      Your working directory is {{cwd}}. You map the target codebase into assets, decompose
      the audit into intents, and delegate deep-dive dataflow tracing to subagents, which
      submit confirmed evidence and findings directly to their assigned intent.
      Follow the codeaudit:protocol system-prompt section exactly.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed
# by owning agent anyway, so one host instance serves every session. What a
# preset chooses is whether its agent can collect and stop background work at
# all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  # This preset's OWN skills/ directory ships with the package (baseUrl is
  # the preset's own directory, resolving wherever the preset is installed);
  # the user's own roots (~/.dsh/skills, project .dsh/skills, …) keep working.
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool. The goal SERVICE, its session driver, and the
# `/goal` command stay on the host plane: the Gateway serves the goal domain as
# Remote endpoints whose receiver comes from a generated descriptor, so it
# resolves `goals` on the host and an entry-local realm here would hide it. The
# registry is keyed by session anyway, so one host instance serves every
# session. What a preset chooses is whether its agent can call the goal tool.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      # Web sessions should start in normal execution mode, not PTC/plan mode.
      disabled: true
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how the current system works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review it but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch the session mode manually; do not proceed.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable
        maxDepth: 1
        # DSH rc.6 inherits the parent preset for a child. Until DSH exposes
        # an `agentPreset: code` delegation option, restrict the inherited
        # codeaudit composition to an execution-only child.
        persona: |-
          你是代码审计执行子 agent，不是指挥官。仅执行委派的审计任务；不要创建 engagement、intent、
          报告，或继续委派。目标代码库只读：只读取/搜索/静态分析，任何动态验证只在隔离目录进行。

          委派输入必须包含目标、范围、父 intentId、待验证任务、已知资产及可引用的资产 ID。父 intentId
          必须是 codeaudit_add_intent 刚返回的实际 ID；delegation-intent-id、intent-id、<intentId> 等均为无效占位符。
          若委派未提供具体真实 ID，不得调用 codeaudit_submit，应简要告知父 agent 补充真实父 intentId。
          不要臆造证据、资产 ID、代码位置或漏洞。

          每发现一组独立、已确认的证据/资产/漏洞，就立即调用 codeaudit_submit 分批提交；不要等到任务结束：
          {"intentId":"委派给出的 ID","evidences":[...],"assets":[...],"findings":[...]}。
          evidence 必须含 detail，可选 kind/location/file:line 代码片段 snippet/confidence；提交成功会返回本批
          分配的真实 ID（evidenceIds/assetIds/findingIds）。finding 仅限有证据支撑的问题，必须含
          title/severity/location/status，evidenceIds 只能引用本次提交返回的 ID、既往提交返回的 ID 或委派中
          提供的既有 ID，绝不臆测编号；尚未拿到证据 ID 时分两批：先提交证据，再用返回的 ID 提交 finding。
          能从代码与路由推导出完整请求的漏洞（即使未实际发送）都要构造 poc：完整 HTTP raw 纯报文写入 poc
          字段，绝不夹注释；参数生成规则、占位符含义写入单独的 pocNote 字段并注明「静态构造，未经发送
          验证」或「已动态验证」。确实无法构造可重放请求的才留空 poc。构造 POC 前先用 skill 工具
          加载 codeaudit-methodology 技能（构造规范），需要 Yakit 脚本式 POC 或拿不准报文写法时
          再加载 yak 技能（官方语法参考）；技能不存在时按上述规则直接构造。status=confirmed 需已排查 sanitizer/框架防护，否则用 suspected。asset 的 parentId、finding 的
          affectedAssetId 只能引用委派中提供的或既往提交返回的既有资产。没有对应结果时传空数组，绝不重复
          提交同一条数据。

          提交成功后，最终回复仅包含结论、关键证据摘要（位置列表）和提交计数，不粘贴大段源码或完整 JSON。
        toolFilter:
          deny:
            - codeaudit_set_engagement
            - codeaudit_add_intent
            - codeaudit_add_evidence
            - codeaudit_add_finding
            - codeaudit_add_asset
            - codeaudit_state
            - codeaudit_graph
            - codeaudit_report
            - subagent
            - subagent_fork

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable
        maxDepth: 1
        persona: |-
          你是代码审计执行子 agent，不是指挥官。仅执行委派的审计任务；不要创建 engagement、intent、
          报告，或继续委派。目标代码库只读：只读取/搜索/静态分析，任何动态验证只在隔离目录进行。

          委派输入必须包含目标、范围、父 intentId、待验证任务、已知资产及可引用的资产 ID。父 intentId
          必须是 codeaudit_add_intent 刚返回的实际 ID；delegation-intent-id、intent-id、<intentId> 等均为无效占位符。
          若委派未提供具体真实 ID，不得调用 codeaudit_submit，应简要告知父 agent 补充真实父 intentId。
          不要臆造证据、资产 ID、代码位置或漏洞。

          每发现一组独立、已确认的证据/资产/漏洞，就立即调用 codeaudit_submit 分批提交；不要等到任务结束：
          {"intentId":"委派给出的 ID","evidences":[...],"assets":[...],"findings":[...]}。
          evidence 必须含 detail，可选 kind/location/file:line 代码片段 snippet/confidence；提交成功会返回本批
          分配的真实 ID（evidenceIds/assetIds/findingIds）。finding 仅限有证据支撑的问题，必须含
          title/severity/location/status，evidenceIds 只能引用本次提交返回的 ID、既往提交返回的 ID 或委派中
          提供的既有 ID，绝不臆测编号；尚未拿到证据 ID 时分两批：先提交证据，再用返回的 ID 提交 finding。
          能从代码与路由推导出完整请求的漏洞（即使未实际发送）都要构造 poc：完整 HTTP raw 纯报文写入 poc
          字段，绝不夹注释；参数生成规则、占位符含义写入单独的 pocNote 字段并注明「静态构造，未经发送
          验证」或「已动态验证」。确实无法构造可重放请求的才留空 poc。构造 POC 前先用 skill 工具
          加载 codeaudit-methodology 技能（构造规范），需要 Yakit 脚本式 POC 或拿不准报文写法时
          再加载 yak 技能（官方语法参考）；技能不存在时按上述规则直接构造。status=confirmed 需已排查 sanitizer/框架防护，否则用 suspected。asset 的 parentId、finding 的
          affectedAssetId 只能引用委派中提供的或既往提交返回的既有资产。没有对应结果时传空数组，绝不重复
          提交同一条数据。

          提交成功后，最终回复仅包含结论、关键证据摘要（位置列表）和提交计数，不粘贴大段源码或完整 JSON。
        toolFilter:
          deny:
            - codeaudit_set_engagement
            - codeaudit_add_intent
            - codeaudit_add_evidence
            - codeaudit_add_finding
            - codeaudit_add_asset
            - codeaudit_state
            - codeaudit_graph
            - codeaudit_report
            - subagent
            - subagent_fork

    # Product providers are host-plane singletons. Copy this preset, then
    # remove `disabled` from either ordinary tool row to expose that product
    # only to agents composed from the copy.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── code audit mode ─────────────────────────────────────────────────────────

# The single codeaudit plugin: nine model-facing codeaudit_* tools on the host
# tools registry, the codeaudit:protocol system-prompt section (the
# 测绘→规划→深挖→验证定级→报告 protocol, injected automatically — the user only
# sends target + objective), and the standing codeaudit session-projection unit
# for the Web panel. It publishes no service and consumes the host
# `storageDomain` facility, so it needs no realm.
- id: codeaudit
  name: 'dsh-codeaudit/codeaudit'
